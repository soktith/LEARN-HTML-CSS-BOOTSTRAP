<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Mercurial Golden Touch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark">
    <div class="container min-vh-100 d-flex align-items-center py-4">
        <div class="row w-100 justify-content-center g-3">
 
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <article class="card border-0 rounded-4 shadow-lg overflow-hidden">
 
                    <!-- Image -->
                    <div class="position-relative bg-warning">
                        <img class="w-100 object-fit-cover"
                             src="https://i.pinimg.com/1200x/42/9a/bb/429abba3f6173cda1f8a1b957c54ebf2.jpg"
                             alt="Nike Mercurial Golden Touch football boots">
                        <span class="badge rounded-pill text-bg-dark position-absolute top-0 start-0 m-3 px-3 py-2">
                            Special edition
                        </span>
                        <span class="badge rounded-pill text-bg-danger position-absolute top-0 end-0 m-3 px-3 py-2">
                            -11%
                        </span>
                    </div>
 
                    <!-- Content -->
                    <div class="card-body p-4">
                        <p class="text-uppercase fw-bold text-body-secondary small mb-1">Nike</p>
                        <h3 class="fw-bold fst-italic mb-2">Mercurial Golden Touch</h3>
                        <p class="text-body-secondary mb-3">
                            Made for Luka Modrić's Ballon d'Or win. A one-off gold colorway for the player who owns the midfield.
                        </p>
 
                        <!-- Rating -->
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <span class="text-warning" aria-hidden="true">
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star"></i>
                            </span>
                            <span class="fw-semibold">4.1</span>
                            <span class="visually-hidden">out of 5 stars</span>
                        </div>
 
                        <!-- Price -->
                        <div class="d-flex align-items-baseline gap-2 mb-4">
                            <span class="display-6 fw-bold">$330</span>
                            <del class="text-body-secondary">$370</del>
                        </div>
 
                        <!-- Actions -->
                        <div class="d-flex gap-2">
                            <button class="btn btn-dark btn-lg rounded-3 flex-grow-1">Buy now</button>
                            <button class="btn btn-outline-dark btn-lg rounded-3">
                                <i class="bi bi-bag-plus me-1"></i>+Add
                            </button>
                        </div>
                    </div>
 
                </article>
            </div>
 
        </div>

        
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
