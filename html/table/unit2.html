<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table  align="center" border="1" style="border: 2px; border-spacing: 0px; width: 80%; text-align: center; border-spacing: 2px;">
        <tr>
            <th colspan="5">Table</th>
        </tr>
        <tr>
            <td rowspan="2">A</td>
            <td colspan="3">B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
            <td colspan="4">F</td>
        </tr>
        <tr>
            <td colspan="3">G</td>
            <td rowspan="2" colspan="2">H</td>
        </tr>
        <tr>
            <td colspan="2">I</td>
            <td>J</td>
        </tr>
        <tr>
            <td rowspan="2" colspan="2">K</td>
            <td>L</td>
            <td>M</td>
            <td>N</td>
        </tr>
        <tr>
            <td>O</td>
            <td colspan="2">P</td>
        </tr>
    </table>
</body>
</html>
