<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="w-75 m-auto">
        <div id="carouselStacked" class="carousel slide">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Top controls</h5>
            <div>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev">
                <span class="carousel-icon-prev" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
                <span class="carousel-icon-next" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
            </div>
        </div>
        <div class="carousel-inner rounded-5">
            <div class="carousel-item active">
            <img src="https://i.pinimg.com/736x/fa/f3/f7/faf3f71d817c5fa27582a3c624247636.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
            <img src="https://i.pinimg.com/736x/4b/94/94/4b9494fced665f63392ca2a29a74688f.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
            <img src="https://i.pinimg.com/736x/9a/fc/26/9afc26b7f577fc9b863a3b0ca1c00b57.jpg" class="d-block w-100" alt="...">
            </div>
        </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
