<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

</head>
<body>
    <h1 class="text-danger text-center fs1">
        <i><u>Create User Input Form</u></i>
    </h1>

    <div class="container mt-5">
        <form action="/register" method="post" class="w-50 m-auto rounded-3 form shadow border-1 p-3">
            <h1 class="text-center text-info-emphasis fw-bold"><i>Register</i></h1>
            <!--Name-->
            <label class="fs-5 fw-bold text-black"><i>Name</i></label>
            <div class="input-group">
                <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
                </span>
                <input type="text" name="name" required class="form-control w-12" placeholder="Enter Your Name">
            </div><br>
            <!--Email-->
            <label class="fs-5 fw-bold text-black"><i>Email</i></label>
            <div class="input-group">
                <span class="input-group-text">
                <i class="bi bi-envelope-at-fill"></i>
                </span>
                <input type="email" name="email" required class="form-control w-12" placeholder="Enter Your Email">
            </div><br>
            <!--Password-->
            <label class="fs-5 fw-bold text-black"><i>Password</i></label>
            <div class="input-group">
                <span class="input-group-text">
                <i class="bi bi-eye-fill"></i>
                </span>
                <input type="password" name="password" required class="form-control w-12" placeholder="Enter Your Password">
                
            </div><br><br>

            <div class="w-75 m-auto">
                <button class=" bg-primary p-2 form-control"> ><h5><i>Login</i></h5></button>
            </div>
            
        </form>
    </div>
</body>
</html>
